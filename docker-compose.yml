version: '3.8'

services:
  app:
    build: .
    ports:
      - '3000:3000'
    volumes:
      - ./src:/app/src
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:-local_dev_password_only}
      - DB_NAME=express_pro
      - JWT_SECRET=${JWT_SECRET:-local_dev_jwt_secret_only}
      - JWT_EXPIRES_IN=1d
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=express_pro
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:6-jammy
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data:
